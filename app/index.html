<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SystemC Constructor</title>
<link rel="stylesheet" href="style.css">
<!-- Monaco Editor CDN -->
<link rel="stylesheet" data-name="vs/editor/editor.main"
  href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/editor/editor.main.min.css">
</head>
<body>

<div class="header">
  <h1>🔄 SystemC Constructor</h1>
  <span class="badge"
    title="SC_THREAD и wait() не работают — WASI без pthread; используйте SC_METHOD">
    JS + WASM · SC_METHOD только
  </span>
</div>

<div class="main-layout">
  <!-- Palette -->
  <div class="palette" id="palette">
    <h3>🔧 Элементы</h3>
    <div id="palette-list"></div>
  </div>

  <!-- Canvas -->
  <div class="canvas-wrap" id="canvas-wrap">
    <svg id="canvas-svg"></svg>
  </div>

  <!-- Editor Panel -->
  <div class="editor-panel">
    <div class="editor-header">
      <span class="badge" style="color:#4fc3f7;">⚡ Monaco — C++/SystemC</span>
    </div>
    <div class="editor-wrap" id="editor-wrap">
      <div id="monaco-container"></div>
    </div>
    <div class="compile-bar">
      <button id="btn-compile-cpp">⚡ C++ → WASM</button>
    </div>
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <button id="btn-reset" class="danger">↺ Сброс</button>
  <button id="btn-step" class="primary">⏭ Шаг</button>
  <button id="btn-run">▶ Запуск</button>
  <span class="status-text" id="status-text">Загрузка...</span>
  <span id="cycle-display" class="val-display">Такт: 0</span>
</div>

<!-- Log -->
<div class="log-panel" id="log-panel"></div>

<!-- Monaco AMD loader (должен быть до main.js, чтобы определить global require) -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>

<!-- Главный модуль приложения -->
<script type="module" src="main.js"></script>

</body>
</html>
