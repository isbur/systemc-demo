<!DOCTYPE html>

<!-- Monaco Editor CDN -->
<link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/editor/editor.main.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #111; color: #e0e0e0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

  /* ─── Header ─── */

    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; background: #1a1a2e; border-bottom: 1px solid #333;
    flex-shrink: 0;
  }
  .header h1 { font-size: 1.1rem; font-weight: 600; }
  .header .badge { font-size: 0.7rem; color: #888; }

  /* ─── Layout ─── */
  .main-layout { display: flex; flex: 1; overflow: hidden; }

  /* Left: Palette */
  .palette {
    width: 140px; background: #16162a; border-right: 1px solid #333;
    padding: 8px; overflow-y: auto; flex-shrink: 0;

  /* Center: Canvas */
  .canvas-wrap { flex: 1; position: relative; background: #0d0d1a; overflow: hidden; }
  .canvas-wrap svg { width: 100%; height: 100%; }

  /* Right: Monaco */
  .editor-panel {
    width: 360px; background: #1a1a2e; border-left: 1px solid #333;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .editor-panel .tabs {
    display: flex; background: #222; border-bottom: 1px solid #333; flex-shrink: 0;
  }
  .editor-panel .tabs button {
    flex: 1; padding: 6px 10px; border: none; background: transparent;

  .editor-panel .tabs button.active { color: #4fc3f7; border-bottom-color: #4fc3f7; }
  .editor-panel .tabs button:hover { color: #ccc; }

  .bottom-bar button:hover { background: #3a3a6a; }
  .bottom-bar button.primary { background: #1565c0; }
  .bottom-bar button.primary:hover { background: #1976d2; }
  .bottom-bar button.danger { background: #b71c1c; }
  .bottom-bar .status-text { flex: 1; color: #888; }
  .bottom-bar .val-display { font-family: monospace; color: #4fc3f7; }

  /* Log */
  .log-panel {
    height: 120px; background: #0a0a1a; border-top: 1px solid #333;
    overflow-y: auto; padding: 6px 12px; font-family: monospace; font-size: 0.75rem;
    flex-shrink: 0;
  }
  .log-panel .line { color: #666; }
  .log-panel .line.info { color: #4fc3f7; }
  .log-panel .line.err { color: #f55; }
  .log-panel .line.ok { color: #4caf50; }

  .hidden { display: none !important; }

<body>

<div class="header">
  <h1>🔄 SystemC Constructor</h1>
  <span class="badge" title="SC_THREAD и wait() не работают — WASI без pthread; используйте SC_METHOD">JS + WASM · SC_METHOD только</span>
</div>

<div class="main-layout">
  <!-- Palette -->
  <div class="palette" id="palette">
    <h3>🔧 Элементы</h3>
    <div id="palette-list"></div>
  </div>

  <!-- Canvas -->
  <div class="canvas-wrap" id="canvas-wrap">
    <svg id="canvas-svg"></svg>
  </div>

  <!-- Editor Panel -->
  <div class="editor-panel">
    <div style="padding: 6px 10px; font-size: 0.75rem; color: #888; background: #222; border-bottom: 1px solid #333;">
      <span class="badge" style="color:#4fc3f7;">⚡ Monaco — C++/SystemC</span>
    </div>
    <div class="editor-wrap" id="editor-wrap">
      <div id="monaco-container"></div>
    </div>
    <div style="padding: 6px; border-top: 1px solid #333; display: flex; gap: 6px; flex-shrink: 0;">
      <button id="btn-compile-cpp" style="flex:1; background:#1565c0; color:#fff; border:none; padding:6px 14px; border-radius:8px; cursor:pointer; font-size:0.85rem;">⚡ C++ → WASM</button>
    </div>
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <button id="btn-reset" class="danger">↺ Сброс</button>
  <button id="btn-step" class="primary">⏭ Шаг</button>
  <button id="btn-run">▶ Запуск</button>
  <span class="status-text" id="status-text">Готово. Перетащите элементы на канву</span>
  <span id="cycle-display" class="val-display">Такт: 0</span>
</div>

<!-- Log -->
<div class="log-panel" id="log-panel"></div>

<script>
// Monaco AMD loader
</script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>

<script type="module">
// ─── Imports ──────────────────────────────────────────────────────────────
import { SimEngine, LogicElement, GATES } from './elements.js';
import { VisualConstructor } from './constructor.js';

// ─── State ────────────────────────────────────────────────────────────────
const sim = new SimEngine();
let viz = null;
let isRunning = false;
let autoTimer = null;
const logPanel = document.getElementById('log-panel');

// ─── WASI заглушки для браузера (wasi_snapshot_preview1) ──────────────────
function makeWasiPreview1() {
  let mem; const ok = () => 0;
  const wasi = {
    fd_close: ok, fd_fdstat_get: ok, fd_fdstat_set_flags: ok,
    fd_read: (fd, iovs, iovsLen, nreadPtr) => { try {
      new Uint32Array(mem.buffer)[nreadPtr >> 2] = 0; return 0;
    } catch { return 0; } },
    fd_seek: ok, path_open: () => -1,
    fd_write: (fd, iovs, iovsLen, nwPtr) => { try {
      const u8 = new Uint8Array(mem.buffer); const u32 = new Uint32Array(mem.buffer); let s = '';
      for (let i = 0; i < iovsLen; i++) {
        const b = u32[(iovs + i * 8) >> 2]; const l = u32[(iovs + i * 8 + 4) >> 2];
        for (let j = 0; j < l; j++) s += String.fromCharCode(u8[b + j]);
      }
      u32[nwPtr >> 2] = s.length; if (s.trim()) log('[wasm] ' + s.trim(), 'line');
      return 0;
    } catch { return 0; } },
    environ_sizes_get: ok, environ_get: ok,
    args_sizes_get: ok, args_get: ok,
    random_get: (buf, len) => { try { const u8 = new Uint8Array(mem.buffer, buf, len); crypto.getRandomValues(u8); return 0; } catch { return 0; } },
    clock_time_get: ok, proc_exit: (code) => { log(`WASI exit(${code})`, 'info'); },
  };
  wasi._setMemory = (m) => { mem = m; };
  return wasi;
}

// ─── C++ → WASM — через @yowasp/clang (LLVM 22 в браузере) ────────────────
// ─── Serwer URL (заменить на ваш после деплоя) ─────────────────────────
const COMPILE_SERVER = 'http://127.0.0.1:3082';

// ─── C++ → WASM ──────────────────────────────────────────────────────────
document.getElementById('btn-compile-cpp').addEventListener('click', async () => {
  const code = monacoEditor.getValue();
  const hasSystemc = code.includes('<systemc.h>') || code.includes('SC_MODULE') || code.includes('sc_main');

  if (hasSystemc) {
    // ─── SystemC в браузере (через @yowasp/clang + precompiled unity.o) ──
    log('⏳ Загрузка SystemC VFS...', 'info');
    document.getElementById('status-text').textContent = '⏳ SystemC...';
    try {
      // Загружаем yowasp clang, unity.o, VFS headers
      const [clangMod, unityResp, vfsResp] = await Promise.all([
        import('https://cdn.jsdelivr.net/npm/@yowasp/clang/+esm'),
        fetch('/app/systemc-unity.o'),
        fetch('/app/systemc-vfs.json'),
      ]);
      const { runClang } = clangMod;
      const unityBuf = await unityResp.arrayBuffer();
      const headersVFS = await vfsResp.json();

      log('⚙ Компиляция SystemC...', 'info');
      // VFS: unity.o, main.cc, и все заголовки
      const vfs = {
        'main.cc': code,
        'systemc-unity.o': new Uint8Array(unityBuf),
        ...headersVFS,
      };

      const args = [
        'clang++', 'main.cc', '-std=c++17',
        'systemc-unity.o',  // предсобранный SystemC как объектный файл
        '-o', 'module.wasm',
        '-Wl,--no-entry,--export=init,--export=step,--export=reset_ring,--export=get_q,--export=set_enable',
        '--target=wasm32-wasip1', '-I.',
        '-O2',
      ];
      const result = await runClang(args, vfs);
      const wasmBuf = result['module.wasm'];
      if (!wasmBuf) throw new Error('no wasm');

      const wasi = makeWasiPreview1();
      const inst = await WebAssembly.instantiate(await WebAssembly.compile(wasmBuf), { wasi_snapshot_preview1: wasi });
      wasi._setMemory(inst.exports.memory); const ex = inst.exports;
      if (ex.__wasm_call_ctors) try { ex.__wasm_call_ctors(); } catch(e) {}
      if (ex.init && ex.reset_ring) { ex.init(); ex.reset_ring(); }

      const pmm = { label: 'SysC', inputPins: ['in0','in1','in2','in3','in4','in5','in6','in7'], outputPins: ['out0','out1','out2','out3'], color: '#673AB7' };
      GATES['wasm-module'] = pmm;
      viz.addElement('wasm-module', 300, 200);
      const lv = Array.from(viz.elementViews.values()).pop();
      if (lv) { lv.el.name='SysC';
        lv.el._evaluateFn = (inp, out) => { const v = ex.get_q ? ex.get_q() : 0; out.out0=(v>>0)&1; out.out1=(v>>1)&1; out.out2=(v>>2)&1; out.out3=(v>>3)&1; };
        lv.el._clockEdgeFn = (edge, inp, out) => { if(edge!=='pos') return; if(ex.set_enable) ex.set_enable(inp.in1??0); const v = ex.step ? ex.step() : 0; out.out0=(v>>0)&1; out.out1=(v>>1)&1; out.out2=(v>>2)&1; out.out3=(v>>3)&1; };
        lv.el._resetFn = () => { if(ex.reset_ring) ex.reset_ring(); };
        viz._renderElement(lv);
      }
      document.getElementById('status-text').textContent = '✅ SystemC in-browser';
    } catch(e) { log('❌ ' + e.message, 'err'); document.getElementById('status-text').textContent = '❌ Ошибка'; }
  } else {
    // ─── Через @yowasp/clang в браузере ─────────────────────────────
    log('⏳ Загрузка LLVM 22...', 'info');
    document.getElementById('status-text').textContent = '⏳ LLVM...';
    try {
      const { runClang } = await import('https://cdn.jsdelivr.net/npm/@yowasp/clang/+esm');
      log('⚙ Компиляция C++ → WASM...', 'info');
      document.getElementById('status-text').textContent = '⏳ Компиляция...';
      const result = await runClang([
        'clang++', '-std=c++17', 'module.cc', '-o', 'module.wasm',
        '-Wl,--no-entry,--export=init,--export=step,--export=reset_ring,--export=get_q,--export=set_enable',
        '--target=wasm32-wasi', '-O2',
      ], { 'module.cc': code });
      const wasmBuffer = result['module.wasm'];
      if (!wasmBuffer) throw new Error(result.exitCode ? 'exit ' + result.exitCode : 'no wasm');
      const wasi = makeWasiPreview1();
      const inst = await WebAssembly.instantiate(await WebAssembly.compile(wasmBuffer), { wasi_snapshot_preview1: wasi });
      wasi._setMemory(inst.exports.memory); const exports = inst.exports;
      if (exports.__wasm_call_ctors) try { exports.__wasm_call_ctors(); } catch(e) {}
      if (exports.init && exports.reset_ring) { exports.init(); exports.reset_ring(); }
      GATES['wasm-module'] = { label: 'Wasm', inputPins: ['in0','in1','in2','in3','in4','in5','in6','in7'], outputPins: ['out0','out1','out2','out3'], color: '#673AB7' };
      viz.addElement('wasm-module', 300, 200);
      const last = Array.from(viz.elementViews.values()).pop();
      if (last) {
        last.el.name = 'Wasm';
        last.el._evaluateFn = (inp, out) => { const v = exports.get_q ? exports.get_q() : 0; out.out0=(v>>0)&1; out.out1=(v>>1)&1; out.out2=(v>>2)&1; out.out3=(v>>3)&1; };
        last.el._clockEdgeFn = (edge, inp, out) => { if(edge!=='pos') return; if(exports.set_enable) exports.set_enable(inp.in1??0); const v = exports.step ? exports.step() : 0; out.out0=(v>>0)&1; out.out1=(v>>1)&1; out.out2=(v>>2)&1; out.out3=(v>>3)&1; };
        last.el._resetFn = () => { if(exports.reset_ring) exports.reset_ring(); };
        viz._renderElement(last);
      }
      document.getElementById('status-text').textContent = '✅ WASM (LLVM 22)';
    } catch(e) { log('❌ ' + e.message, 'err'); document.getElementById('status-text').textContent = '❌ Ошибка'; }
  }
});

function log(msg, cls = 'line') {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = `> ${msg}`;
  logPanel.appendChild(d);
  logPanel.scrollTop = logPanel.scrollHeight;
}

// ─── Persistence (localStorage) ────────────────────────────────────────────
const STORAGE_KEY = 'systemc-constructor-v1';

function saveState() {
  if (!viz) return;
  const data = {
    viz: viz.serialize(),
    connections: sim.serializeConnections(),
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    log(`Ошибка сохранения: ${e.message}`, 'err');
  }
}

let saveTimer = null;
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 300);
}

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    if (!data.viz?.elements?.length) return;
    viz.deserialize(data.viz);
    sim.deserializeConnections(data.connections || [], (uid) => {
      const view = viz.elementViews.get(uid);
      return view ? view.el : null;
    });
    viz.updateStates();
    document.getElementById('status-text').textContent =
      `↻ Восстановлено элементов: ${data.viz.elements.length}`;
    log(`Схема восстановлена из localStorage (${data.viz.elements.length} элементов)`, 'ok');
  } catch (e) {
    log(`Не удалось восстановить схему: ${e.message}`, 'err');
  }
}

// ─── Init Sim Engine ──────────────────────────────────────────────────────
sim.on('step', ({ cycle }) => {
  document.getElementById('cycle-display').textContent = `Такт: ${cycle}`;
  if (viz) viz.updateStates();
});

// ─── Init Monaco Editor ──────────────────────────────────────────────────
const defaultCustomCode = `// ─── 4-битный кольцевой регистр на SystemC ────────────────────
//  ⚠ SC_THREAD и wait() НЕ поддерживаются (WASI без pthread)!
//  Используйте только SC_METHOD / SC_CTHREAD.
//
//  Модуль ДОЛЖЕН называться user_module (так его находит обёртка).
//  Порты: clk, rst_n, enable (входы), q — sc_uint<4> (выход).

#include <systemc.h>

SC_MODULE(user_module) {
    sc_in<bool>  clk;
    sc_in<bool>  rst_n;
    sc_in<bool>  enable;
    sc_out<sc_uint<4>> q;

    sc_uint<4> shift_reg;

    void shift_proc() {
        if (!rst_n.read()) {
            shift_reg = 1;
        } else if (enable.read()) {
            bool msb = shift_reg[3];
            shift_reg = shift_reg << 1;
            shift_reg[0] = msb;
        }
        q.write(shift_reg);
    }

    SC_CTOR(user_module) {
        SC_METHOD(shift_proc);
        sensitive << clk.pos();
        sensitive << rst_n.neg();
    }
};
`;

let monacoEditor = null;
require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs' } });
require(['vs/editor/editor.main'], function() {
  monacoEditor = monaco.editor.create(document.getElementById('monaco-container'), {
    value: defaultCustomCode,
    language: 'cpp',
    theme: 'vs-dark',
    fontSize: 13,
    minimap: { enabled: false },
    automaticLayout: true,
    scrollBeyondLastLine: false,
    tabSize: 2,
  });
  document.getElementById('status-text').textContent = 'Monaco Editor готов';
});

// ─── Init Visual Constructor ──────────────────────────────────────────────
const svg = document.getElementById('canvas-svg');
viz = new VisualConstructor(svg, sim);

viz.onEvent = (event, data) => {
  scheduleSave();
  if (event === 'element-placed') {
    document.getElementById('status-text').textContent = `➕ ${data.name}`;
    log(`Добавлен элемент: ${data.name} (${data.type})`, 'ok');
  }
};

sim.on('connected', () => scheduleSave());

// Восстанавливаем сохранённую схему
loadState();

// ─── Palette ──────────────────────────────────────────────────────────────
const paletteList = document.getElementById('palette-list');
for (const [type, config] of Object.entries(GATES)) {
  const item = document.createElement('div');
  item.className = 'palette-item';
  item.draggable = true;
  item.innerHTML = `<span class="dot" style="background:${config.color}"></span>
    <span class="label">${config.label}</span>
    <span class="pins">${config.inputPins.length}→${config.outputPins.length}</span>`;
  item.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', type);
    e.dataTransfer.effectAllowed = 'copy';
  });
  paletteList.appendChild(item);
}

// Drop on canvas
svg.addEventListener('dragover', (e) => e.preventDefault());
svg.addEventListener('drop', (e) => {
  e.preventDefault();
  const type = e.dataTransfer.getData('text/plain');
  if (!type || !GATES[type]) return;
  const rect = svg.getBoundingClientRect();
  const x = e.clientX - rect.left - 45;
  const y = e.clientY - rect.top - 20;
  viz.addElement(type, Math.max(0, x), Math.max(0, y));
});

// ─── C++ → WASM компиляция (настоящий SystemC) ────────────────────────────
// Простой TAR-ридер (формат ustar) — скопирован из @eduoj/wasm-clang
// ─── Controls ─────────────────────────────────────────────────────────────
document.getElementById('btn-step').addEventListener('click', () => {
  sim.step();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  sim.resetAll();
  if (viz) viz.updateStates();
  document.getElementById('cycle-display').textContent = 'Такт: 0';
  document.getElementById('status-text').textContent = '↺ Сброшено';
  log('Схема сброшена', 'info');
});

document.getElementById('btn-run').addEventListener('click', () => {
  if (isRunning) {
    sim.stop();
    isRunning = false;
    document.getElementById('btn-run').textContent = '▶ Запуск';
    document.getElementById('status-text').textContent = '⏸ Остановлено';
  } else {
    sim.start(100);
    isRunning = true;
    document.getElementById('btn-run').textContent = '⏸ Стоп';
    document.getElementById('status-text').textContent = '▶ Симуляция запущена';
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); document.getElementById('btn-run').click(); }
  if (e.key === 's' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); document.getElementById('btn-step').click(); }
  if (e.key === 'r' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); document.getElementById('btn-reset').click(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && viz && viz.selectedId) {
    e.preventDefault();
    const deleted = viz.selectedId;
    viz.deleteElement(deleted);
    log(`Удалён элемент #${deleted}`, 'info');
  }
});

log('Приложение загружено. Перетащите элементы на канву!', 'info');
log('Space — пуск/стоп, S — шаг, R — сброс, Ctrl+Enter — применить JS', 'line');
</script>
</body>
</html>
