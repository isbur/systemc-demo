<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SystemC Constructor</title>
<script>
  // На сервере с готовыми COOP/COEP воркер не регистрируется.
  // На GitHub Pages он сам дописывает require-corp: credentialless здесь изоляцию не включает.
  window.coi = {
    coepCredentialless: () => false,
    coepDegrade: () => false,
    quiet: true,
  };
</script>
<script src="coi-serviceworker.js"></script>
<link rel="stylesheet" href="style.css">
<!-- Monaco Editor CDN -->
<link rel="stylesheet" data-name="vs/editor/editor.main"
  href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/editor/editor.main.min.css">
<!-- Предзагрузка компилятора (105 MB LLVM в WASM) — начинаем качать сразу -->
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@yowasp/clang/+esm">
</head>
<body>

<div class="header">
  <h1>🔄 SystemC Constructor</h1>
  <span class="badge" title="SC_THREAD исполняется в Worker, канва шлёт ему сообщения">
    JS + WASM · pthread
  </span>
</div>

<div class="main-layout">
  <!-- Palette -->
  <div class="palette" id="palette">
    <h3>🔧 Элементы</h3>
    <div id="palette-list"></div>
  </div>

  <!-- Canvas: JointJS paper. Подсказка не перехватывает мышь. -->
  <div class="canvas-wrap" id="canvas-wrap">
    <div id="paper-host"></div>
    <p class="wire-hint" id="wire-hint">
      Соединение: потяните от выходного порта (кружок справа) к входному (кружок слева).
      На вход — только один провод. Delete — удалить блок или провод.
    </p>
  </div>

  <!-- Editor Panel -->
  <div class="editor-panel">
    <div class="editor-header">
      <span id="editor-title" class="badge" style="color:#4fc3f7;">⚡ Monaco — C++/SystemC</span>
      <button id="btn-editor-back" type="button" hidden>К своему модулю</button>
    </div>
    <div class="editor-wrap" id="editor-wrap">
      <div id="monaco-container"></div>
    </div>
    <div class="compile-bar">
      <button id="btn-compile-cpp">⚡ C++ → WASM</button>
    </div>
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <button id="btn-reset" class="danger">↺ Сброс</button>
  <button id="btn-step" class="primary">⏭ Шаг</button>
  <button id="btn-run">▶ Запуск</button>
  <span class="status-text" id="status-text">Загрузка...</span>
  <span id="cycle-display" class="val-display">Такт: 0</span>
</div>

<!-- Log -->
<div class="log-panel" id="log-panel"></div>
<form id="stdin-form" class="stdin-form">
  <span class="stdin-prompt">stdin</span>
  <input id="stdin-input" autocomplete="off" spellcheck="false" placeholder="Строка уходит в stdin последнего модуля">
</form>

<!-- JointJS до Monaco: loader.js объявляет AMD define и иначе перехватит UMD-сборку. -->
<script src="vendor/joint/joint.min.js"></script>
<!-- Monaco AMD loader (должен быть до main.js, чтобы определить global require) -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>

<!-- Главный модуль приложения -->
<script type="module" src="main.js"></script>

</body>
</html>
