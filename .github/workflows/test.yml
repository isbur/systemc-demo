name: Tests

on:
  push:
  pull_request:

jobs:
  circuit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Generator
        working-directory: 09-browser-systemc
        run: node test-netlist.mjs
      - name: Simulation and incremental build
        working-directory: 09-browser-systemc
        run: node test-circuit.mjs
